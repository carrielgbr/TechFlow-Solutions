<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TechFlow Tasks</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .tarefa { border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
    .status { font-size: 12px; color: #555; }
    .aviso { background: #eef; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    input, textarea { width: 100%; margin-bottom: 8px; padding: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>TechFlow Tasks</h1>

  {% for mensagem in get_flashed_messages() %}
    <div class="aviso">{{ mensagem }}</div>
  {% endfor %}

  <h2>Nova tarefa</h2>
  <form method="post" action="{{ url_for('criar') }}">
    <input type="text" name="titulo" placeholder="Título" required>
    <textarea name="descricao" placeholder="Descrição (opcional)"></textarea>
    <button type="submit">Criar tarefa</button>
  </form>

  <h2>Tarefas</h2>
  {% for t in tarefas %}
    <div class="tarefa">
      <strong>{{ t.titulo }}</strong>
      <div>{{ t.descricao }}</div>
      <div class="status">{{ t.status }}</div>
      <a href="{{ url_for('editar', id_tarefa=t.id) }}">Editar</a>
    </div>
  {% else %}
    <p>Nenhuma tarefa cadastrada.</p>
  {% endfor %}
</body>
</html>
