{% extends "base.html" %}

{% block titulo %}Editar {{ tarefa.codigo }} · TechFlow Tasks{% endblock %}

{% block conteudo %}
<section class="painel painel-estreito">
  <a class="voltar" href="{{ url_for('index') }}">← Voltar ao quadro</a>
  <h1>Editar tarefa <span class="codigo">{{ tarefa.codigo }}</span></h1>

  <form class="form-editar" method="post">
    <div class="campo">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" name="titulo" maxlength="100"
             value="{{ tarefa.titulo }}" required>
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="5">{{ tarefa.descricao }}</textarea>
    </div>

    <fieldset class="campo">
      <legend>Status</legend>
      <div class="opcoes-status">
        {% for s in status_validos %}
          <label class="opcao-status opcao-{{ loop.index0 }}">
            <input type="radio" name="status" value="{{ s }}"
                   {% if s == tarefa.status %}checked{% endif %}>
            <span>{{ s }}</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <div class="form-acoes">
      <a class="botao botao-secundario" href="{{ url_for('index') }}">Cancelar</a>
      <button class="botao botao-primario" type="submit">Salvar alterações</button>
    </div>
  </form>
</section>
{% endblock %}
